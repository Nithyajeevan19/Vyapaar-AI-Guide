kind = "web"
previewPath = "/"
title = "Vyapaar AI"
version = "1.0.0"
id = "artifacts/vyapaar-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25694

[services.development]
run = "pnpm --filter @workspace/vyapaar-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vyapaar-ai", "run", "build" ]
publicDir = "artifacts/vyapaar-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25694"
BASE_PATH = "/"
